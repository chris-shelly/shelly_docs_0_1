  USECASE-10:
    start_line: 63
    path: use_cases\use_cases.md#usecase-10-addupdate-an-item-via-cli
    level: 1
    end_line: 81
    markdown: "# USECASE-10 Add/Update an Item via CLI\n```yaml (data)\nstatus: done\n\
      ```\nGenerally, we'd expect an agent to write Items by using markdown, but we
      should also allow a way to update items using json. \n```bash\nshelly-docs item
      put \"file.md\" \"# DESIGN-3 Capture Data\nCapture Data from user input\" \n\
      # put an item to the KB using JSON\n```\nFormat of an item\n- filepath is relative
      to the Knowledge Base Path\n```json\n{\n  \"filepath\": \"file.md\",\n  \"markdown\"\
      : \"# DESIGN-3 Capture Data \\n Capture Data from user input\"\n}\n```\n\n"
    title: USECASE-10 Add/Update an Item via CLI
    type: USECASE
    uuid: bcfc9c12-4a37-4b94-9c5b-96ad2bc091d1
    data:
      status: done
      type: USECASE
    content: "Generally, we'd expect an agent to write Items by using markdown, but
      we should also allow a way to update items using json. \n```bash\nshelly-docs
      item put \"file.md\" \"# DESIGN-3 Capture Data\nCapture Data from user input\"\
      \ \n# put an item to the KB using JSON\n```\nFormat of an item\n- filepath is
      relative to the Knowledge Base Path\n```json\n{\n  \"filepath\": \"file.md\"\
      ,\n  \"markdown\": \"# DESIGN-3 Capture Data \\n Capture Data from user input\"\
      \n}\n```"
    key: USECASE-10
    parent:
