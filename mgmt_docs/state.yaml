  SYSTEM-4-3:
    start_line: 61
    path: system\kb.md#system-4-3-make_item_key
    level: 2
    end_line: 73
    markdown: "## SYSTEM-4-3 `make_item_key()`\n```yaml (data)\ncomponent_type: function\n\
      related_to:\n- SYSTEM-5\n```\nFunction used to read a knowledge base and determine
      the correct key for a new item being created that does not yet have one (i.e.
      if an item is being creaetd via kb.create_item())\n\nReads from the `KnowledgeBase.state`
      (`state.yaml::ids`), and then returns the next available ID\n- If an Item has
      a parent, we check for the next available key under that parent\n- else, we
      check for the next available key under that item type.\n\n\n"
    name: '`make_item_key()`'
    type: SYSTEM
    uuid: e1c00ac4-1be7-4410-9281-0a11cc44a1f7
    data:
      component_type: function
      related_to:
      - SYSTEM-5
    content: "Function used to read a knowledge base and determine the correct key
      for a new item being created that does not yet have one (i.e. if an item is
      being creaetd via kb.create_item())\n\nReads from the `KnowledgeBase.state`
      (`state.yaml::ids`), and then returns the next available ID\n- If an Item has
      a parent, we check for the next available key under that parent\n- else, we
      check for the next available key under that item type."
    key: SYSTEM-4-3
    parent: SYSTEM-4
    document: system\kb.md#system-4-3-make_item_key
  SYSTEM-5:
    start_line: 74
    path: system\kb.md#system-5-knowledge-base-kb_path
    level: 1
    end_line: 85
    markdown: "# SYSTEM-5 Knowledge Base (`{kb_path}/`)\n```yaml (data)\ncomponent_type:
      data # data per user\n```\nA Shelly Docs Knowledge Base is a file folder that
      has:\n- [`{kb_path}/shellydocs.yaml`](#system-5-1-shellydocsyaml)\n  - acts
      as the root of the knowledge base folder\n  - specifies the item types and jobs
      available in that knowledge base\n- [`{kb_path}/state.yaml`](#system-5-2-stateyaml)\n\
      \  - after running `shelly-docs kb update` or `KnowledgeBase.update_state()`,
      a `state.yaml` file is created in the Knowledge Base\n  - holds data on the
      `items` and `ids`\n\n"
    name: Knowledge Base (`{kb_path}/`)
    type: SYSTEM
    uuid: 6255166e-18bb-4603-9cab-325f9fd84495
    data:
