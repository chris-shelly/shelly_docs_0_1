  DESIGN-1-1:
    start_line: 9
    path: design\kb_and_item.md#design-1-1-knowledge-base-stateyaml
    level: 2
    end_line: 21
    markdown: "## DESIGN-1-1 Knowledge Base `state.yaml`\nWithin the Knowledge Base
      is a `state.yaml` file that stores the data on the `Item`s like a very simplistic
      kind of database collection.\n```yaml\nitems:\n  ABC-32:\n    title: \"ABC-32
      Retrieve Data\",\n    content: \"Retrieve data so we can display it to the user\"\
      ,\n    parent_title: \"\" #empty if there is no parent item\n  ABC-33:\n   \
      \ title: \"ABC-33 Display Data\"\n    # ...\n```\n\n"
    name: Knowledge Base `state.yaml`
    type: DESIGN
    uuid: 13cc62fc-bec3-40de-a15a-2c7363abf7a7
    data:
    content: "Within the Knowledge Base is a `state.yaml` file that stores the data
      on the `Item`s like a very simplistic kind of database collection.\n```yaml\n\
      items:\n  ABC-32:\n    title: \"ABC-32 Retrieve Data\",\n    content: \"Retrieve
      data so we can display it to the user\",\n    parent_title: \"\" #empty if there
      is no parent item\n  ABC-33:\n    title: \"ABC-33 Display Data\"\n    # ...\n\
      ```"
    key: DESIGN-1-1
