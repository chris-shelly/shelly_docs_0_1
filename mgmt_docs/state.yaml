  DESIGN-2:
    start_line: 22
    path: design\kb_and_item.md#design-2-item
    level: 1
    end_line: 25
    markdown: "# DESIGN-2 `Item`\nAn `Item` is a piece of markdown documentation content
      within a [Knowledge Base](#design-1-knowledge-base).\n\nAn `Item` is defined
      as a markdown heading with content under it.\n"
    name: '`Item`'
    type: DESIGN
    uuid: 56ba4cfa-2f33-4c15-9249-c0bf308c83d8
    data:
    content: "An `Item` is a piece of markdown documentation content within a [Knowledge
      Base](#design-1-knowledge-base).\n\nAn `Item` is defined as a markdown heading
      with content under it."
    key: DESIGN-2
    parent:
    document: design\kb_and_item.md#design-2-item
  DESIGN-2-1:
    start_line: 26
    path: design\kb_and_item.md#design-2-1-item-example
    level: 2
    end_line: 38
    markdown: "## DESIGN-2-1 `Item` Example\nFor example,\n```md\n<!-- Item starts
      with the Heading-->\n## ABC-32 Retrieve Data\nRetrieve data so we can display
      itto the user\n<!-- Item ends either with end of the document or another Heading
      with the same or higher level -->\n<!--New Item, separate from ABC-32-->\n##
      ABC-33 Display Data\nDisplay the data to the user\n...\n```\nAside from headings
      of the same or higher level (which would indicate another `Item`), any sort
      of content can be within a given `Item`, including paragraphs, code blocks,
      images, etc.\n"
    name: '`Item` Example'
    type: DESIGN
    uuid: c7b33339-9eab-4b94-b8cc-9f4399dd180b
    data:
    content: "For example,\n```md\n<!-- Item starts with the Heading-->\n## ABC-32
      Retrieve Data\nRetrieve data so we can display itto the user\n<!-- Item ends
      either with end of the document or another Heading with the same or higher level
      -->\n<!--New Item, separate from ABC-32-->\n## ABC-33 Display Data\nDisplay
      the data to the user\n...\n```\nAside from headings of the same or higher level
      (which would indicate another `Item`), any sort of content can be within a given
      `Item`, including paragraphs, code blocks, images, etc."
    key: DESIGN-2-1
    parent: DESIGN-2
    document: design\kb_and_item.md#design-2-1-item-example
  DESIGN-2-2:
    start_line: 39
    path: design\kb_and_item.md#design-2-2-itemdata
    level: 2
    end_line: 44
    markdown: "## DESIGN-2-2 `Item.data`\nAn `Item` can have structured data attached
      to it within the markdown document.\n\nA yaml code block with the `yaml (data)`
      around it is then parsed and saved alongside the item in state.\n\nThis data
      can later be queried from the `state.yaml` to provide information to the user
      about the items.\n"
    name: '`Item.data`'
    type: DESIGN
    uuid: 69d58710-4958-4ad8-b260-158f5c1d80ea
    data:
    content: "An `Item` can have structured data attached to it within the markdown
      document.\n\nA yaml code block with the `yaml (data)` around it is then parsed
      and saved alongside the item in state.\n\nThis data can later be queried from
      the `state.yaml` to provide information to the user about the items."
    key: DESIGN-2-2
    parent: DESIGN-2
    document: design\kb_and_item.md#design-2-2-itemdata
  DESIGN-2-3:
    start_line: 45
    path: design\kb_and_item.md#design-2-3-itemdatatype
    level: 2
    end_line: 52
    markdown: "## DESIGN-2-3 `Item.data.type`\n```yaml (data)\nstatus: done\ntype:
      whatever I want\n```\nBy default, the item `type` is retrieved based on the
      Item Tag of the Item's title/declaration, and then stored within the Item's
      `data` field so it can be queried.\n\nThe user can overide the ``type`` with
      whatever content they have in the fenced `yaml (data)` code block.\n"
    name: '`Item.data.type`'
    type: DESIGN
    uuid: 0c215af9-cc1a-4e84-8e18-a5b1dc05a958
    data:
      status: done
      type: whatever I want
