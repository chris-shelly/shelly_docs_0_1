  USECASE-12:
    start_line: 91
    path: ..\mgmt_docs\use_cases\use_cases.md#usecase-12-add-data-to-items
    level: 1
    end_line: 102
    markdown: "# USECASE-12 Add Data to Items\n```yaml (data)\nstatus: drafting\n\
      related_to: DESIGN-2-2\n```\nAs seen above, allow Items to have structured data
      that can be analyzed and queried.\n\nData on a given item is provided using
      a yaml `data` code block.\n\nData is then saved in the state of the knowledge
      base, where the item has a field called `\"data\"`, which contains the object
      defined from the yaml code block.\n\n\n"
    title: USECASE-12 Add Data to Items
    data:
      status: drafting
      related_to: DESIGN-2-2
    key: USECASE-12
    parent:
  USECASE-13:
    start_line: 103
    path: 
      ..\mgmt_docs\use_cases\use_cases.md#usecase-13-query-items-based-on-itemdata
    level: 1
    end_line: 128
    markdown: "# USECASE-13 Query Items based on `Item.data`\n```yaml (data)\nstatus:
      drafting\n```\nSearch for Items based on their `data` field.\nAn Item object
      has data from codefences stored in the 'data' object in the state file.\n\n\
      We can then query that data from the state file by iterating through the items
      and checking logical conditions\n\nA query can be formatted with mongodb-like
      objects\n```yaml\n# format\n<field>: <query_obj> # scalar for a single value,
      or a mapping for checking several conditions\n\n# query for status of done\n\
      status: done\n# ...\n# query conditionals\npoints:\n  $gte: 3\n  $lte: 8\n$or:\n\
      \  - status: drafting\n  - winner: true\n```\n\n"
    title: USECASE-13 Query Items based on `Item.data`
    data:
      status: drafting
    key: USECASE-13
    parent:
