  USECASE-12:
    start_line: 91
    path: use_cases\use_cases.md#usecase-12-add-data-to-items
    level: 1
    end_line: 104
    markdown: "# USECASE-12 Add Data to Items\n```yaml (data)\nstatus: done\nrelated_to:
      DESIGN-2-2\n```\nAs seen above, allow Items to have structured data that can
      be analyzed and queried.\n\nData on a given item is provided using a yaml `data`
      code block.\n\nData is then saved in the state of the knowledge base, where
      the item has a field called `\"data\"`, which contains the object defined from
      the yaml code block.\n\nBy default, at least the 'type' will be added to the
      data object, but it can be overwritten by a type specified in the code fence.\n\
      \n\n"
    name: Add Data to Items
    type: USECASE
    uuid: c1d93258-9827-43d8-8123-bed910d93eee
    data:
      status: done
      related_to: DESIGN-2-2
    content: "As seen above, allow Items to have structured data that can be analyzed
      and queried.\n\nData on a given item is provided using a yaml `data` code block.\n\
      \nData is then saved in the state of the knowledge base, where the item has
      a field called `\"data\"`, which contains the object defined from the yaml code
      block.\n\nBy default, at least the 'type' will be added to the data object,
      but it can be overwritten by a type specified in the code fence."
    key: USECASE-12
    parent:
    document: use_cases\use_cases.md#usecase-12-add-data-to-items
  USECASE-13:
    start_line: 105
    path: use_cases\use_cases.md#usecase-13-query-items-based-on-itemdata
    level: 1
    end_line: 130
    markdown: "# USECASE-13 Query Items based on `Item.data`\n```yaml (data)\nstatus:
      done\n```\nSearch for Items based on their `data` field.\nAn Item object has
      data from codefences stored in the 'data' object in the state file.\n\nWe can
      then query that data from the state file by iterating through the items and
      checking logical conditions\n\nA query can be formatted with mongodb-like objects\n\
      ```yaml\n# format\n<field>: <query_obj> # scalar for a single value, or a mapping
      for checking several conditions\n\n# query for status of done\nstatus: done\n\
      # ...\n# query conditionals\npoints:\n  $gte: 3\n  $lte: 8\n$or:\n  - status:
      drafting\n  - winner: true\n```\n\n"
    name: Query Items based on `Item.data`
    type: USECASE
    uuid: a73da498-b3de-486a-b740-5d63f3d02c39
    data:
      status: done
    content: "Search for Items based on their `data` field.\nAn Item object has data
      from codefences stored in the 'data' object in the state file.\n\nWe can then
      query that data from the state file by iterating through the items and checking
      logical conditions\n\nA query can be formatted with mongodb-like objects\n```yaml\n\
      # format\n<field>: <query_obj> # scalar for a single value, or a mapping for
      checking several conditions\n\n# query for status of done\nstatus: done\n# ...\n\
      # query conditionals\npoints:\n  $gte: 3\n  $lte: 8\n$or:\n  - status: drafting\n\
      \  - winner: true\n```"
    key: USECASE-13
    parent:
    document: use_cases\use_cases.md#usecase-13-query-items-based-on-itemdata
  USECASE-13-1:
    start_line: 131
    path: use_cases\use_cases.md#usecase-13-1-querying-item-collections
    level: 2
    end_line: 155
    markdown: "## USECASE-13-1 Querying Item Collections\n```yaml (data)\nstatus:
      done\n```\nWe allow searching for values in an array\nWhen a query criteria
      applies to an array, it needs to check for the value.\n\n```yaml\n# example
      'Item.data'\ndays: # days array\n- DAY-19\n- DAY-20\n- DAY-21\n```\n\n```yaml\n\
      # query to get items that have 'DAY-20' in their 'days' array\ndays: DAY-20\n\
      # field: value\n```\n\nIf the 'field' we're querying is an array, but the 'value'
      we're checking for is not an array, then we search return items with that 'value'
      in the array\n- this makes it so we can still search for exact match arrays,
      AND we can also search for specific values in an array.\n\n\n"
    name: Querying Item Collections
    type: USECASE
    uuid: 229c80f1-b845-489f-80a1-21cd25d03252
    data:
      status: done
    content: "We allow searching for values in an array\nWhen a query criteria applies
      to an array, it needs to check for the value.\n\n```yaml\n# example 'Item.data'\n\
      days: # days array\n- DAY-19\n- DAY-20\n- DAY-21\n```\n\n```yaml\n# query to
      get items that have 'DAY-20' in their 'days' array\ndays: DAY-20\n# field: value\n\
      ```\n\nIf the 'field' we're querying is an array, but the 'value' we're checking
      for is not an array, then we search return items with that 'value' in the array\n\
      - this makes it so we can still search for exact match arrays, AND we can also
      search for specific values in an array."
    key: USECASE-13-1
    parent: USECASE-13
    document: use_cases\use_cases.md#usecase-13-1-querying-item-collections
