  USECASE-10:
    title: USECASE-10 Add/Update an Item via CLI
    content: "```yaml\nstatus: done\n```\n\nGenerally, we'd expect an agent to write
      Items by using markdown, but we should also allow a way to update items using
      json.\n\n```bash\nshelly-docs item put \"file.md\" \"# DESIGN-3 Capture Data\n\
      Capture Data from user input\" \n# put an item to the KB using JSON\n```\n\n\
      Format of an item\n\n- filepath is relative to the Knowledge Base Path\n\n```json\n\
      {\n  \"filepath\": \"file.md\",\n  \"markdown\": \"# DESIGN-3 Capture Data \\
      n Capture Data from user input\"\n}\n```"
    parent_title: ''
    path: 
      ..\mgmt_docs\use_cases\use_cases.md#usecase-10-addupdate-an-item-via-cli
    level: 1
