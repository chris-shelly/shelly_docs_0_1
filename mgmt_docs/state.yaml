    markdown: "# PROMPT-1 Reading Item Content\n## `Role`\nYou are a Senior Python
      Developer with extensive experience parsing and extending markdown. You are
      familiar with the `mistletoe` library for parsing and manipulating the AST of
      Markdown Documents.\n## `Background on Goal`\nIn `crud.py`, we want to update
      the `get_items()` function to parse documentation Items. Letting us determine
      the `title`, `content`, and `parent_title` (if applicable).\n## `Design` - Documentation
      `Item`s\nAn `Item` is a piece of markdown documentation content within a [Knowledge
      Base](#design-1-knowledge-base).\n\nAn `Item` is defined as a markdown heading
      with content under it.\n\nFor example ...\n\n\n```md\n<!-- Item starts with
      the Heading-->\n## ABC-32 Retrieve Data\nRetrieve data so we can display it
      to the user\n<!-- Item ends either with end of the document or another Heading
      with the same or higher level -->\n<!--New Item, separate from ABC-32-->\n##
      ABC-33 Display Data\nDisplay the data to the user\n...\n```\nAside from headings
      of the same or higher level (which would indicate another `Item`), any sort
      of content can be within a given `Item`, including paragraphs, code blocks,
      images, etc.\n\n## `Goal`\nIn `crud.py`, update the `get_items()` function to
      parse documentation Items. A documentation item must be made available as json.\n\
      ```yaml\n{\n\"title\": \"ABC-32 Retrieve Data\",\n\"content\": \"Retrieve data
      so we can display it to the user\",\n\"parent_title\": \"\" #empty because there
      is no parent `Item`\n}\n```\n## ``Claude Plan``\n- Recursive traversal should
      be replaced with a linear scan approach\n- Add a `node_to_markdown` helper\n\
      - Cleaning up debug prints\n\n"
    title: PROMPT-1 Reading Item Content
    type: PROMPT
    uuid: 7557735d-7490-4311-a9d1-741820b849b4
    data:
    content: "## `Role`\nYou are a Senior Python Developer with extensive experience
      parsing and extending markdown. You are familiar with the `mistletoe` library
      for parsing and manipulating the AST of Markdown Documents.\n## `Background
      on Goal`\nIn `crud.py`, we want to update the `get_items()` function to parse
      documentation Items. Letting us determine the `title`, `content`, and `parent_title`
      (if applicable).\n## `Design` - Documentation `Item`s\nAn `Item` is a piece
      of markdown documentation content within a [Knowledge Base](#design-1-knowledge-base).\n\
      \nAn `Item` is defined as a markdown heading with content under it.\n\nFor example
      ...\n\n\n```md\n<!-- Item starts with the Heading-->\n## ABC-32 Retrieve Data\n\
      Retrieve data so we can display it to the user\n<!-- Item ends either with end
      of the document or another Heading with the same or higher level -->\n<!--New
      Item, separate from ABC-32-->\n## ABC-33 Display Data\nDisplay the data to the
      user\n...\n```\nAside from headings of the same or higher level (which would
      indicate another `Item`), any sort of content can be within a given `Item`,
      including paragraphs, code blocks, images, etc.\n\n## `Goal`\nIn `crud.py`,
      update the `get_items()` function to parse documentation Items. A documentation
      item must be made available as json.\n```yaml\n{\n\"title\": \"ABC-32 Retrieve
      Data\",\n\"content\": \"Retrieve data so we can display it to the user\",\n\"\
      parent_title\": \"\" #empty because there is no parent `Item`\n}\n```\n## ``Claude
      Plan``\n- Recursive traversal should be replaced with a linear scan approach\n\
      - Add a `node_to_markdown` helper\n- Cleaning up debug prints"
    key: PROMPT-1
    parent:
